# ==============================================================================
# 栞 · 轻量漫画库 生产环境 NGINX 强化配置
# 架构：公网开放前台阅读 / 严格私网/VPN/白名单隔离管理后台 (Defense in Depth)
# ==============================================================================

upstream manga_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name manga.example.com;
    server_tokens off;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name manga.example.com;

    server_tokens off;

    # SSL 证书配置 (按需替换为实际证书路径)
    # ssl_certificate /etc/letsencrypt/live/manga.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/manga.example.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;

    # 全局安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 16M;

    # 严格防护：禁止访问隐藏文件、数据库与环境变量
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(db|sqlite|sqlite3|env|ini|log|bak|tar|gz|zip)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 静态资源缓存
    location /static/ {
        alias /home/leaf/manga_site_v1/app/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # 缩略图代理缓存
    location /thumb/ {
        proxy_pass http://manga_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 【核心安全控制】管理后台及管理接口：仅允许内网/VPN/白名单访问
    location ~ ^/(admin|api/admin|api/scanner|api/system|api/config|api/security) {
        # 1. 允许本地回环
        allow 127.0.0.1;
        allow ::1;

        # 2. 允许内网网段 (按实际局域网/Tailscale/WireGuard 网段调整)
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        # allow 100.64.0.0/10; # Tailscale VPN 网段

        # 3. 拒绝所有其他外部公网 IP
        deny all;

        proxy_pass http://manga_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # 公开前台
    location / {
        proxy_pass http://manga_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
