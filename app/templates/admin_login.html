<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理登录</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="login-wrap"><div class="login-card"><h1>管理后台</h1>{% if error %}<div class="error">{{ error }}</div>{% endif %}{% if not has_admin %}<p>首次启动，请先设置管理员。</p><form method="post" action="/admin/setup"><input name="username" required placeholder="管理员用户名"><input name="password" type="password" minlength="12" required placeholder="密码（至少12位）"><button>创建管理员</button></form>{% else %}<form method="post" action="/admin/login"><input name="username" required placeholder="用户名"><input name="password" type="password" required placeholder="密码"><button>登录</button></form>{% endif %}</div></main></body></html>
