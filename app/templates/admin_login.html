<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f1e8">
<title>管理登录 · 轻量漫画库</title>
<link rel="stylesheet" href="/static/style.css?v=20260904_natural_01">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-page-base: #f6f1e8;
  --bg-pass: rgba(253, 251, 247, 0.92);
  --text-main: #2b241e;
  --text-secondary: #5e5246;
  --text-muted: #8d7e70;
  --text-subtle: #b6a99c;
  --accent-terra: #c8684f;
  --accent-terra-hover: #b3563e;
  --accent-teal: #415a63;
  --accent-sage: #667d6c;
  --border-subtle: rgba(186, 172, 157, 0.45);
  --border-medium: rgba(186, 172, 157, 0.7);
  --font-serif: "Noto Serif SC", "Songti SC", Georgia, serif;
  --font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body.archive-pass-body {
  font-family: var(--font-sans);
  background-color: var(--bg-page-base);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  position: relative;
  overflow-x: hidden;
}

.ambient-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
  overflow: hidden;
  background-color: var(--bg-page-base);
}

.ambient-haze {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
}

.haze-teal {
  top: -10vw;
  left: -10vw;
  width: 55vw;
  height: 55vw;
  background: radial-gradient(circle, rgba(65, 90, 99, 0.08) 0%, transparent 75%);
}

.haze-terracotta {
  top: -5vw;
  right: -10vw;
  width: 60vw;
  height: 60vw;
  background: radial-gradient(circle, rgba(200, 104, 79, 0.08) 0%, transparent 80%);
}

.paper-grain {
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
  background-repeat: repeat;
  mix-blend-mode: multiply;
  opacity: 0.9;
}

.archive-pass-card {
  width: 100%;
  max-width: 380px;
  background: var(--bg-pass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-subtle);
  border-radius: 18px;
  padding: 36px 30px 32px;
  box-shadow: 0 10px 30px rgba(43, 36, 30, 0.05);
  display: flex;
  flex-direction: column;
}

.pass-emblem-zone {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.pass-mark-seal {
  width: 36px;
  height: 36px;
  background: var(--accent-terra);
  color: #ffffff;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-serif);
  font-size: 18px;
  font-weight: 700;
  box-shadow: 0 2px 8px rgba(200, 104, 79, 0.25);
  margin-bottom: 12px;
}

.pass-main-title {
  font-family: var(--font-serif);
  font-size: 19px;
  font-weight: 700;
  color: var(--text-main);
  line-height: 1.3;
}

.pass-divider {
  width: 100%;
  height: 1px;
  background: var(--border-subtle);
  margin: 18px 0;
}

.pass-notice-block {
  margin-bottom: 16px;
  text-align: center;
}

.notice-desc {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
}

.pass-error-alert {
  background: rgba(200, 104, 79, 0.08);
  border: 1px solid rgba(200, 104, 79, 0.25);
  color: var(--accent-terra);
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 12.5px;
  margin-bottom: 16px;
  text-align: center;
}

.pass-form {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.pass-field-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.pass-label-zh {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-main);
}

.pass-input {
  width: 100%;
  padding: 10px 14px;
  background: #ffffff;
  border: 1px solid var(--border-medium);
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-main);
  outline: none;
  transition: all 0.18s ease;
  box-shadow: 0 1px 3px rgba(43, 36, 30, 0.03);
}

.pass-input:focus {
  border-color: var(--accent-terra);
  box-shadow: 0 0 0 3px rgba(200, 104, 79, 0.12);
}

.pass-input::placeholder {
  color: var(--text-subtle);
}

.pass-action-zone {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 6px;
}

.btn-pass-submit {
  width: 100%;
  padding: 11px 20px;
  background: var(--accent-terra);
  color: #ffffff;
  border: none;
  border-radius: 9999px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.18s ease;
  box-shadow: 0 3px 12px rgba(200, 104, 79, 0.22);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.btn-pass-submit:hover,
.btn-pass-submit:active {
  background: var(--accent-terra-hover);
  transform: translateY(-1px);
}

.pass-footer-nav {
  margin-top: 22px;
  text-align: center;
}

.pass-back-link {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  text-decoration: none;
  transition: color 0.18s ease;
}

.pass-back-link:hover {
  color: var(--accent-terra);
}
</style>
</head>
<body class="archive-pass-body">

<div class="ambient-canvas" aria-hidden="true">
  <div class="ambient-haze haze-teal"></div>
  <div class="ambient-haze haze-terracotta"></div>
  <div class="paper-grain"></div>
</div>

<main class="archive-pass-card">
  <div class="pass-emblem-zone">
    <div class="pass-mark-seal" title="栞">栞</div>
    <h1 class="pass-main-title font-serif">{% if not has_admin %}初始化管理员{% else %}控制台登录{% endif %}</h1>
  </div>

  <div class="pass-divider"></div>

  {% if error %}
  <div class="pass-error-alert">
    {{ error }}
  </div>
  {% endif %}

  {% if not has_admin %}
  <div class="pass-notice-block">
    <div class="notice-desc">
      系统尚未建立管理员身份。<br>请设置唯一的管理账号与密码。
    </div>
  </div>

  <form class="pass-form" method="post" action="/admin/setup">
    <div class="pass-field-group">
      <label class="pass-label-zh" for="username">管理员账号</label>
      <input class="pass-input" id="username" name="username" type="text" required autocomplete="username" placeholder="admin" autofocus>
    </div>

    <div class="pass-field-group">
      <label class="pass-label-zh" for="password">登录密码</label>
      <input class="pass-input" id="password" name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="至少8位字符">
    </div>

    <div class="pass-action-zone">
      <button class="btn-pass-submit" type="submit">
        <span>创建管理员</span>
      </button>
    </div>
  </form>

  {% else %}

  <form class="pass-form" method="post" action="/admin/login">
    <div class="pass-field-group">
      <label class="pass-label-zh" for="username">管理员账号</label>
      <input class="pass-input" id="username" name="username" type="text" required autocomplete="username" placeholder="admin" autofocus>
    </div>

    <div class="pass-field-group">
      <label class="pass-label-zh" for="password">登录密码</label>
      <input class="pass-input" id="password" name="password" type="password" required autocomplete="current-password" placeholder="请输入密码">
    </div>

    <div class="pass-action-zone">
      <button class="btn-pass-submit" type="submit">
        <span>登录</span>
      </button>
    </div>
  </form>
  {% endif %}

  <nav class="pass-footer-nav">
    <a class="pass-back-link" href="/">‹ 返回首页</a>
  </nav>
</main>

</body>
</html>
