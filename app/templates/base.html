<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f1e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>{{ config.site_title|default('轻量漫画库') }}</title>
<link rel="stylesheet" href="/static/style.css?v=20260904_natural_01">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="{% block body_class %}{% endblock %}">

<!-- 柔和纸墨微粒与静谧底衬 -->
<div class="ambient-canvas" aria-hidden="true">
  <div class="ambient-haze haze-teal"></div>
  <div class="ambient-haze haze-terracotta"></div>
  <div class="ambient-haze haze-sage"></div>
  <div class="paper-grain"></div>
</div>

<!-- 顶部导航 -->
<header class="topbar">
  <div class="brand-wrapper">
    <div class="brand-mark" title="栞">栞</div>
    <a class="brand-text" href="/">
      <span class="brand-title">{{ config.site_title|default('轻量漫画库') }}</span>
    </a>
  </div>

  {% block topbar_nav %}
  <nav class="topbar-nav">
    <a class="nav-link" href="/">探索</a>
    <a class="nav-link" href="/#archive">书架</a>
    <a class="nav-link" href="/#continue-reading" id="nav-history-item" style="display:none;">
      <span>继续阅读</span>
      <span class="nav-history-badge" id="nav-history-count">0</span>
    </a>
    <a class="nav-link" href="/#archive">搜索</a>
    <a class="nav-link admin-pill" href="/admin" title="管理控制台">控制台</a>
  </nav>

  <!-- 手机端汉堡菜单按钮 -->
  <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="打开菜单" type="button">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>
  {% endblock %}
</header>

<!-- 手机端导航抽屉 -->
<div class="mobile-nav-backdrop" id="mobileNavBackdrop" aria-hidden="true"></div>
<aside class="mobile-nav-drawer" id="mobileNavDrawer" aria-label="移动端导航">
  <div class="drawer-head">
    <div class="drawer-brand">
      <div class="brand-mark">栞</div>
      <div class="brand-text">
        <span class="brand-title">{{ config.site_title|default('轻量漫画库') }}</span>
      </div>
    </div>
    <button class="drawer-close-btn" id="mobileNavClose" aria-label="关闭菜单" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>
  <nav class="drawer-nav-list">
    <a class="drawer-nav-link" href="/" onclick="closeMobileNav()">
      <span class="drawer-link-zh">探索</span>
    </a>
    <a class="drawer-nav-link" href="/#archive" onclick="closeMobileNav()">
      <span class="drawer-link-zh">书架</span>
    </a>
    <a class="drawer-nav-link" href="/#continue-reading" onclick="closeMobileNav()">
      <span class="drawer-link-zh">继续阅读</span>
      <span class="drawer-badge" id="drawer-history-count" style="display:none;">0</span>
    </a>
    <a class="drawer-nav-link" href="/#archive" onclick="closeMobileNav()">
      <span class="drawer-link-zh">搜索</span>
    </a>
    <div class="drawer-divider"></div>
    <a class="drawer-nav-link drawer-admin-link" href="/admin" onclick="closeMobileNav()">
      <span class="drawer-link-zh">控制台</span>
    </a>
  </nav>
</aside>

<main class="container">
{% block content %}{% endblock %}
</main>

<!-- 本地离线免登录阅读历史引擎 -->
<script>
(function() {
  const DB_NAME = "MangaArchiveLocalDB";
  const DB_VERSION = 1;
  const STORE_NAME = "reading_history";

  function getDeviceHash() {
    let hash = localStorage.getItem("manga_anon_device_id");
    if (!hash) {
      hash = "dev_" + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
      localStorage.setItem("manga_anon_device_id", hash);
    }
    return hash;
  }

  function openDB() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) return resolve(null);
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function(e) {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          const store = db.createObjectStore(STORE_NAME, { keyPath: "manga_id" });
          store.createIndex("updated_at", "updated_at", { unique: false });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    });
  }

  window.MangaArchive = {
    getDeviceHash: getDeviceHash,
    saveProgress: async function(item) {
      const db = await openDB();
      if (!db) return;
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        item.updated_at = Date.now();
        store.put(item);
        tx.oncomplete = () => {
          window.dispatchEvent(new CustomEvent("manga-history-updated"));
          resolve(true);
        };
        tx.onerror = () => resolve(false);
      });
    },
    getAllHistory: async function() {
      const db = await openDB();
      if (!db) return [];
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        req.onsuccess = () => {
          const list = req.result || [];
          list.sort((a, b) => (b.updated_at || 0) - (a.updated_at || 0));
          resolve(list);
        };
        req.onerror = () => resolve([]);
      });
    },
    removeProgress: async function(mangaId) {
      const db = await openDB();
      if (!db) return;
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        store.delete(mangaId);
        tx.oncomplete = () => {
          window.dispatchEvent(new CustomEvent("manga-history-updated"));
          resolve(true);
        };
      });
    }
  };

  // 移动端菜单抽屉控制
  window.openMobileNav = function() {
    document.body.classList.add("mobile-nav-open");
  };
  window.closeMobileNav = function() {
    document.body.classList.remove("mobile-nav-open");
  };

  const toggleBtn = document.getElementById("mobileMenuToggle");
  const closeBtn = document.getElementById("mobileNavClose");
  const backdrop = document.getElementById("mobileNavBackdrop");
  if (toggleBtn) toggleBtn.addEventListener("click", window.openMobileNav);
  if (closeBtn) closeBtn.addEventListener("click", window.closeMobileNav);
  if (backdrop) backdrop.addEventListener("click", window.closeMobileNav);
  document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") window.closeMobileNav();
  });

  // 顶部导航历史徽章更新
  async function updateNavBadge() {
    const list = await window.MangaArchive.getAllHistory();
    const item = document.getElementById("nav-history-item");
    const count = document.getElementById("nav-history-count");
    const drawerCount = document.getElementById("drawer-history-count");
    if (list && list.length > 0) {
      if (item) item.style.display = "inline-flex";
      if (count) count.textContent = list.length;
      if (drawerCount) {
        drawerCount.style.display = "inline-flex";
        drawerCount.textContent = list.length;
      }
    } else {
      if (item) item.style.display = "none";
      if (drawerCount) drawerCount.style.display = "none";
    }
  }

  window.addEventListener("manga-history-updated", updateNavBadge);
  document.addEventListener("DOMContentLoaded", updateNavBadge);
})();
</script>

</body>
</html>
