<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f1e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>{{ config.site_title|default('轻量漫画库') }} · CURATED MANGA ARCHIVE</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="{% block body_class %}{% endblock %}">

<!-- 多层柔和有机水彩与纸墨微粒肌理底衬 (Layered Atmospheric Watercolor Canvas) -->
<div class="ambient-canvas" aria-hidden="true">
  <div class="ambient-haze haze-teal"></div>
  <div class="ambient-haze haze-terracotta"></div>
  <div class="ambient-haze haze-sage"></div>
  <div class="ambient-haze haze-ocean"></div>
  <div class="ambient-haze haze-peach"></div>
  <div class="paper-grain"></div>
  <div class="ambient-vignette"></div>
</div>

<!-- 杂志式轻量顶部导航 (Curated Editorial Header) -->
<header class="topbar">
  <div class="brand-wrapper">
    <div class="brand-mark" title="栞 · 典藏印记">栞</div>
    <a class="brand-text" href="/">
      <span class="brand-title">{{ config.site_title|default('轻量漫画库') }}</span>
      <span class="brand-subtitle">CURATED MANGA LIBRARY</span>
    </a>
  </div>

  {% block topbar_nav %}
  <nav class="topbar-nav font-mono">
    <a class="nav-link" href="/">
      <span>探索 EXPLORE</span>
    </a>
    <a class="nav-link" href="/#archive">
      <span>书架 COLLECTION</span>
    </a>
    <a class="nav-link nav-history-link" href="/#continue-reading" id="nav-history-item" style="display:none;">
      <span>继续品读 READING</span>
      <span class="nav-history-badge" id="nav-history-count">0</span>
    </a>
    <a class="nav-link nav-search-trigger" href="/#search-section">
      <span>检索 SEARCH</span>
    </a>
    <a class="nav-link admin-pill" href="/admin" title="进入典藏管理控制台">
      <span>控制中枢</span>
    </a>
  </nav>
  {% endblock %}
</header>

<main class="container">
{% block content %}{% endblock %}
</main>

<!-- 本地离线免登录阅读历史引擎 (Client-Side Anonymous IndexedDB Engine) -->
<script>
(function() {
  const DB_NAME = "MangaArchiveLocalDB";
  const DB_VERSION = 1;
  const STORE_NAME = "reading_history";

  function getDeviceHash() {
    let hash = localStorage.getItem("manga_anon_device_id");
    if (!hash) {
      hash = "dev_" + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
      localStorage.setItem("manga_anon_device_id", hash);
    }
    return hash;
  }

  function openDB() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) return resolve(null);
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function(e) {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          const store = db.createObjectStore(STORE_NAME, { keyPath: "manga_id" });
          store.createIndex("updated_at", "updated_at", { unique: false });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    });
  }

  window.MangaArchive = {
    getDeviceHash: getDeviceHash,
    saveProgress: async function(item) {
      const db = await openDB();
      if (!db) return;
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        item.updated_at = Date.now();
        store.put(item);
        tx.oncomplete = () => {
          window.dispatchEvent(new CustomEvent("manga-history-updated"));
          resolve(true);
        };
        tx.onerror = () => resolve(false);
      });
    },
    getAllHistory: async function() {
      const db = await openDB();
      if (!db) return [];
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        req.onsuccess = () => {
          const list = req.result || [];
          list.sort((a, b) => (b.updated_at || 0) - (a.updated_at || 0));
          resolve(list);
        };
        req.onerror = () => resolve([]);
      });
    },
    removeProgress: async function(mangaId) {
      const db = await openDB();
      if (!db) return;
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        store.delete(mangaId);
        tx.oncomplete = () => {
          window.dispatchEvent(new CustomEvent("manga-history-updated"));
          resolve(true);
        };
      });
    }
  };

  // 顶部导航历史徽章更新
  async function updateNavBadge() {
    const list = await window.MangaArchive.getAllHistory();
    const item = document.getElementById("nav-history-item");
    const count = document.getElementById("nav-history-count");
    if (list && list.length > 0) {
      if (item) item.style.display = "inline-flex";
      if (count) count.textContent = list.length;
    } else {
      if (item) item.style.display = "none";
    }
  }

  window.addEventListener("manga-history-updated", updateNavBadge);
  document.addEventListener("DOMContentLoaded", updateNavBadge);
})();
</script>

</body>
</html>
